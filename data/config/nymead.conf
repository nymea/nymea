# Without a TcpServer configuration, nymead creates an authenticated TLS API
# listener on 0.0.0.0:2222. To disable it, set disabled=true in [TcpServer].
# WebServer, WebSocketServer and MqttServer listeners must be configured explicitly.
# Existing saved listener entries are preserved, including older generated defaults.

# These UDP discovery settings take effect after restarting nymead.
[UPnP]
# Requires a running HTTP or HTTPS web server reachable on an IPv4 LAN interface.
# UPnP stops and resumes automatically as web server availability changes.
enabled=false

[Radio433]
brennenstuhlEnabled=false

# Example optional HTTP listener. Uncomment the entire section to enable it.
# [WebServer]
# local\address=0.0.0.0
# local\port=80
# local\sslEnabled=false
# local\authenticationEnabled=false
# local\publicFolder=/usr/share/nymea-webinterface/public
# local\restServerEnabled=false

# Example optional authenticated WebSocket listener.
# [WebSocketServer]
# local\address=0.0.0.0
# local\port=4444
# local\sslEnabled=true
# local\authenticationEnabled=true

# Example optional MQTT listener.
# [MqttServer]
# local\address=127.0.0.1
# local\port=1883
# local\sslEnabled=false
# local\authenticationEnabled=true

# Optional certificate paths; without these nymead uses its generated certificate.
# [SSL]
# certificate=/etc/ssl/certs/nymead-certificate.crt
# certificate-key=/etc/ssl/private/nymead-certificate.key
